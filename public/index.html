<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriChain Connect — B2B Agricultural Supply Chain Platform</title>
  <meta name="description" content="Decentralized six-role B2B agricultural supply chain platform connecting Farmers, Aggregators, Wholesalers, Processors, Distributors, and Retailers with Escrow, Trust Scores, and AI Route Optimization.">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/onboarding.css">
  <link rel="stylesheet" href="/styles/dashboard.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <!-- Main Application Root -->
  <div id="app-root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Outfit', sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 3rem; animation: pulseGlow 1.5s infinite;">🌾</div>
        <h2 style="margin-top: 1rem; font-weight: 700;">Loading AgriChain Connect...</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem;">Connecting to verified decentralized supply network</p>
      </div>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/components/sharedComponents.js"></script>
  <script src="/js/views/onboardingView.js"></script>
  <script src="/js/views/dashboardViews.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
